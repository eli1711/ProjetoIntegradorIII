<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - Qualidade de Vida Escolar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="stylesheet" href="./css/ux-redesign.css" />
  <script src="js/api-config.js"></script>
</head>
<body class="ux-login">
  <main class="login-shell" id="conteudo-principal">
    <section class="login-brand-panel" aria-label="Qualidade de Vida Escolar">
      <div>
        <img src="img/senai-logo.png" class="logo" alt="Logo SENAI" />
        <h1>Qualidade de Vida Escolar</h1>
        <p>Sistema interno da equipe escolar</p>
      </div>
      <div class="login-system-status">
        <span class="login-status-pill"><i class="fas fa-shield-alt" aria-hidden="true"></i> Acesso protegido</span>
        <span>Use suas credenciais institucionais.</span>
      </div>
    </section>

    <section class="login-container" aria-label="Acesso ao sistema">
      <div class="login-header">
        <img src="img/senai-logo.png" class="logo" alt="Logo SENAI" />
        <h1>Entrar no sistema</h1>
        <p>Informe seu e-mail e senha para continuar.</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">E-mail institucional</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="nome@instituicao.com" />
          <i class="fas fa-envelope" aria-hidden="true"></i>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="senha" required autocomplete="current-password" placeholder="Digite sua senha" />
          <i class="fas fa-lock" aria-hidden="true"></i>
          <a href="#forgot-password" class="forgot-password">Esqueci minha senha</a>
        </div>

        <button type="submit" class="login-button">
          <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
          Entrar
        </button>

        <div class="form-footer">
          <div class="alert" id="loginAlert" role="alert"></div>
        </div>
      </form>

      <div class="security-info">
        <p><i class="fas fa-clock" aria-hidden="true"></i> Sua sessão será encerrada após período de inatividade.</p>
      </div>
    </section>
  </main>

  <div id="forgotPasswordModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close" type="button" aria-label="Fechar">&times;</button>
      <h2><i class="fas fa-key" aria-hidden="true"></i> Recuperar senha</h2>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="recoveryEmail">E-mail institucional</label>
          <input type="email" id="recoveryEmail" name="email" required placeholder="nome@instituicao.com" />
          <i class="fas fa-envelope" aria-hidden="true"></i>
        </div>
        <button type="submit" class="login-button">
          <i class="fas fa-paper-plane" aria-hidden="true"></i>
          Enviar link
        </button>
      </form>
      <div id="recoveryMessage" class="alert" role="alert"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ux-redesign.js"></script>
</body>
</html>
